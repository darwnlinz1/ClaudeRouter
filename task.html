<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Orchestrator // Task Monitor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="/style.css">

    <style>
        #status-badge { transition: all 0.3s ease; }
    </style>
</head>
<body class="h-screen w-screen overflow-x-hidden bg-[#03050a] text-gray-200" style="font-family: 'JetBrains Mono', monospace;">

    <div class="crt-overlay"></div>

    <div class="flex flex-col h-screen w-screen max-w-5xl mx-auto p-6 space-y-5">

        <!-- HEADER: Massive glowing Task ID -->
        <div class="glass-panel rounded-2xl p-6 relative overflow-hidden flex-shrink-0">
            <div class="hud-accent-bar h-[2px] w-full bg-gradient-to-r from-emerald-500 via-cyan-500 to-transparent shadow-[0_0_8px_rgba(16,185,129,0.5)] absolute top-0 left-0"></div>
            <div class="flex items-center justify-between flex-wrap gap-4">
                <div>
                    <p class="text-[10px] text-gray-600 uppercase tracking-[0.3em] font-bold mb-2">// standalone_task_monitor</p>
                    <h1 class="text-2xl md:text-4xl font-extrabold tracking-widest neon-text-emerald text-emerald-400 break-all" id="task-id-header">TASK ID: ---</h1>
                </div>
                <div id="status-badge" class="flex items-center space-x-2 px-4 py-2 bg-black/60 border border-white/10 rounded-xl shadow-inner">
                    <span class="w-2.5 h-2.5 rounded-full bg-gray-600 pulse-dot" id="status-dot"></span>
                    <span class="text-xs font-bold uppercase tracking-widest text-gray-400" id="status-text">Đang kết nối...</span>
                </div>
            </div>
        </div>

        <!-- TERMINAL OUTPUT (SSE stream) -->
        <div class="glass-panel rounded-2xl flex-1 flex flex-col overflow-hidden min-h-0">
            <div class="h-10 bg-black/70 border-b border-white/5 flex items-center px-4 text-[11px] font-mono flex-shrink-0">
                <i class="fa-solid fa-terminal mr-2 text-emerald-500"></i>
                <span class="text-gray-500 uppercase tracking-wider">Live Stream</span>
                <span class="live-badge ml-3 px-1.5 py-0.5 bg-rose-500/10 border border-rose-500/40 rounded text-[9px] text-rose-400 font-bold uppercase tracking-wider shadow-[0_0_8px_rgba(225,29,72,0.3)] flex items-center space-x-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse pulse-dot"></span><span>LIVE</span>
                </span>
            </div>
            <div id="live-stream" class="flex-1 overflow-y-auto p-6 scroll-smooth font-mono text-xs space-y-1.5">
                <p><span class="text-emerald-600">[boot]</span> task_monitor.sys ... <span class="text-emerald-500">OK</span></p>
                <p><span class="text-cyan-600">[boot]</span> mounting sse_stream_handler ... <span class="text-cyan-500">OK</span></p>
                <p class="pt-3 text-gray-600 italic text-sm"><span class="neon-text-emerald text-emerald-700">$</span>&nbsp;Đang chờ kết nối tới task...</p>
            </div>
        </div>

        <!-- JSON RESULT PANEL -->
        <div class="glass-panel rounded-2xl overflow-hidden flex-shrink-0">
            <div class="h-10 bg-black/70 border-b border-white/5 flex items-center px-4 text-[11px] font-mono">
                <i class="fa-solid fa-code mr-2 text-cyan-400"></i>
                <span class="text-gray-500 uppercase tracking-wider">Kết quả JSON</span>
            </div>
            <div id="json-result" class="max-h-64 overflow-y-auto p-5 text-sm text-gray-300 font-mono bg-black/40">
                <div class="flex flex-col items-center justify-center py-8 text-gray-700 opacity-50 space-y-3">
                    <i class="fa-solid fa-code text-3xl"></i>
                    <p class="text-center italic text-xs">Đang chờ AI trả kết quả JSON...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        if (typeof marked !== 'undefined') {
            marked.setOptions({
                highlight: function(code, lang) {
                    if (lang && typeof hljs !== 'undefined' && hljs.getLanguage(lang)) {
                        return hljs.highlight(code, { language: lang }).value;
                    }
                    return typeof hljs !== 'undefined' ? hljs.highlightAuto(code).value : code;
                },
                breaks: true
            });
        }

        function escapeHtml(value) {
            return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
                .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
        function renderSafeMarkdown(value) {
            const source = String(value ?? "");
            const html = typeof marked !== 'undefined' ? marked.parse(source) : escapeHtml(source);
            return typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(html) : escapeHtml(source);
        }

        const params = new URLSearchParams(window.location.search);
        const pathTaskId = window.location.pathname.match(/\/task\/([^/]+)$/)?.[1];
        const taskId = params.get('task_id') || params.get('id') || pathTaskId;
        const streamBox = document.getElementById('live-stream');
        const jsonResult = document.getElementById('json-result');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const taskIdHeader = document.getElementById('task-id-header');

        let currentAiDiv = null;
        let aiBuffer = "";

        function setStatus(state, label) {
            const colors = {
                connecting: 'bg-gray-600',
                running: 'bg-emerald-500',
                done: 'bg-cyan-500',
                error: 'bg-rose-500'
            };
            statusDot.className = `w-2.5 h-2.5 rounded-full pulse-dot ${colors[state] || 'bg-gray-600'}`;
            statusText.innerText = label;
        }

        function scrollToBottom() {
            if (streamBox) streamBox.scrollTop = streamBox.scrollHeight;
        }

        function removeCursor(div) {
            if (div) div.innerHTML = div.innerHTML.replace('<span class="blinking-cursor"></span>', '');
        }

        window.copyCode = function(button) {
            const codeBlock = button.nextElementSibling;
            if (!codeBlock) return;
            navigator.clipboard.writeText(codeBlock.innerText).then(() => {
                const originalText = button.innerHTML;
                button.innerHTML = "✅ Copied!";
                button.classList.add("text-emerald-400", "border-emerald-500");
                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.classList.remove("text-emerald-400", "border-emerald-500");
                }, 2000);
            });
        };

        function startNewAiBubble() {
            aiBuffer = "";
            currentAiDiv = document.createElement('div');
            currentAiDiv.className = "mb-4 p-4 glass-panel border-l-4 border-l-cyan-500 rounded-r-xl shadow-lg markdown-body text-gray-300 relative";
            streamBox.appendChild(currentAiDiv);
        }

        if (!taskId) {
            setStatus('error', 'Thiếu Task ID');
            streamBox.insertAdjacentHTML('beforeend', `<div class="text-rose-400 bg-rose-900/20 p-4 rounded-lg mt-4 border border-rose-800/50 shadow-lg font-bold">[LỖI] Không tìm thấy tham số ?task_id= trên URL.</div>`);
        } else {
            taskIdHeader.innerText = `TASK ID: ${taskId}`;
            setStatus('connecting', 'Đang kết nối...');
            startNewAiBubble();

            let eventSource = null;
            let lastSequence = 0;
            let streamFinished = false;

            function connectStream() {
                eventSource = new EventSource(`/api/stream/${taskId}?after=${lastSequence}`);

                eventSource.onopen = function() {
                    setStatus('running', 'Đang chạy...');
                };

                eventSource.onmessage = function(event) {
                    const streamData = JSON.parse(event.data);
                    if (Number.isFinite(Number(streamData._seq))) {
                        lastSequence = Math.max(lastSequence, Number(streamData._seq));
                    }

                    if (streamData.type === "token") {
                    aiBuffer += streamData.text;
                    let parsedHTML = renderSafeMarkdown(aiBuffer);
                    parsedHTML = parsedHTML.replace(/<pre><code/g, '<button onclick="window.copyCode(this)" class="absolute top-3 right-3 text-xs bg-gray-800 hover:bg-gray-700 border border-gray-600 text-gray-300 px-3 py-1.5 rounded-lg transition shadow">📋 Copy Code</button><pre><code');
                    if (currentAiDiv) currentAiDiv.innerHTML = parsedHTML + '<span class="blinking-cursor"></span>';
                    scrollToBottom();
                    }
                    else if (streamData.type === "status") {
                    const statusLine = document.createElement('div');
                    statusLine.className = "text-gray-500 text-xs font-mono my-2 italic text-center w-full";
                    statusLine.textContent = streamData.data;
                    streamBox.appendChild(statusLine);
                    scrollToBottom();
                    }
                    else if (streamData.type === "finish_chat_turn") {
                    removeCursor(currentAiDiv);
                    startNewAiBubble();
                    }
                    else if (streamData.type === "finish" || streamData.type === "finish_chat") {
                    removeCursor(currentAiDiv);
                    setStatus('done', 'Hoàn tất');
                    streamFinished = true;

                    if (streamData.type === "finish") {
                        let html = `<div class="mb-4 p-3 bg-rose-900/20 border border-rose-800/50 rounded-lg"><span class="font-bold text-rose-400">Lý do dừng AI:</span> <span class="text-gray-300">${escapeHtml(streamData.reason)}</span></div>`;
                        (streamData.turns || []).forEach((turn, idx) => {
                            html += `<div class="p-4 mb-3 bg-[#0a0f18] rounded-xl border border-gray-800 shadow-md">
                                        <span class="text-purple-400 font-bold uppercase tracking-wider text-xs">Lượt xử lý ${idx+1}: ${escapeHtml(turn.tool)}</span>
                                        <pre class="mt-2 text-xs text-gray-400 overflow-x-auto p-2 bg-black rounded">${escapeHtml(turn.detail)}</pre>
                                     </div>`;
                        });
                        jsonResult.innerHTML = html;
                    }
                    eventSource.close();
                    }
                    else if (streamData.type === "error") {
                    removeCursor(currentAiDiv);
                    const errorLine = document.createElement('div');
                    errorLine.className = "text-rose-400 bg-rose-900/20 p-4 rounded-lg mt-4 border border-rose-800/50 shadow-lg font-bold";
                    errorLine.textContent = `[LỖI] ${streamData.data}`;
                    streamBox.appendChild(errorLine);
                    setStatus('error', 'Lỗi');
                    streamFinished = true;
                    eventSource.close();
                    }
                    else if (streamData.type === "done") {
                    setStatus('done', 'Hoàn tất');
                    streamFinished = true;
                    eventSource.close();
                    }
                };

                eventSource.onerror = function() {
                    if (streamFinished) return;
                    eventSource.close();
                    setStatus('connecting', 'Đang kết nối lại...');
                    setTimeout(connectStream, 1500);
                };
            }

            connectStream();
        }
    </script>
</body>
</html>
