name: Release package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/build_release.py
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -c "import server; assert server.FRONTEND_DIST.joinpath('index.html').is_file()"
      - uses: actions/upload-artifact@v7
        with:
          name: ai-orchestrator-release
          path: |
            dist/*.whl
            dist/SHA256SUMS
